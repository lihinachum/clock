<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שעון חדי קרן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #1b1446;
    --sky-mid: #5b2a86;
    --sky-low: #e46fb4;
    --glass: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.35);
    --text: #ffffff;
    --muted: #ffe3f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Rubik', system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%);
    overflow: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* stars */
  #stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 6px #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }

  /* moon */
  .moon {
    position: fixed; top: 6vh; left: 7vw; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe08a 70%);
    box-shadow: 0 0 60px 20px rgba(255, 230, 150, .35);
  }

  /* rainbow */
  .rainbow {
    position: fixed; left: 50%; bottom: -8vh; transform: translateX(-50%);
    width: min(1300px, 140vw); pointer-events: none; opacity: .85;
    filter: drop-shadow(0 0 25px rgba(255,255,255,.35));
  }

  /* clouds */
  .cloud {
    position: fixed; pointer-events: none; opacity: .9;
    animation: drift linear infinite;
  }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  /* main stage */
  .stage {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    gap: 1.5vw; padding: 16px; overflow: hidden;
  }

  .clock-card {
    position: relative;
    padding: clamp(24px, 4vw, 48px) clamp(28px, 6vw, 80px);
    border-radius: 40px;
    background: var(--glass);
    border: 2px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(40, 0, 70, .45), inset 0 0 40px rgba(255,255,255,.12);
    text-align: center;
  }
  .clock-card::before {
    content: ""; position: absolute; inset: -4px; border-radius: 44px; z-index: -1;
    background: conic-gradient(from var(--angle, 0deg), #ff6ec7, #ffd36e, #7dffb3, #6ec8ff, #b98bff, #ff6ec7);
    filter: blur(18px); opacity: .7;
    animation: spin 6s linear infinite;
  }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --angle: 360deg; } }

  .title {
    font-size: clamp(16px, 2.2vw, 26px); font-weight: 600; color: var(--muted);
    letter-spacing: .05em; margin-bottom: 8px;
  }
  .time {
    direction: ltr;
    font-weight: 800;
    font-size: clamp(56px, 11vw, 200px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ff8ad8, #ffe17a, #8affc1, #7ad3ff, #c69bff, #ff8ad8);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 8s linear infinite;
    filter: drop-shadow(0 4px 18px rgba(255, 140, 220, .55));
    white-space: nowrap;
  }
  .time .sec { font-size: .42em; vertical-align: .9em; margin-inline-start: .08em; }
  .time .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .date { margin-top: 14px; font-size: clamp(16px, 2.4vw, 28px); color: var(--muted); }

  /* side unicorns */
  .unicorn-side { width: clamp(120px, 17vw, 320px); flex-shrink: 0; animation: bob 4s ease-in-out infinite; }
  .unicorn-side.left { transform: scaleX(-1); animation-name: bobFlip; animation-delay: -2s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-22px) rotate(2deg); } }
  @keyframes bobFlip { 0%,100% { transform: scaleX(-1) translateY(0) rotate(-2deg); } 50% { transform: scaleX(-1) translateY(-22px) rotate(2deg); } }

  /* flying unicorns */
  .flyer {
    position: fixed; z-index: 1; pointer-events: none;
    animation: fly linear infinite;
  }
  .flyer svg { width: 100%; height: auto; animation: bob 1.6s ease-in-out infinite; }
  @keyframes fly {
    from { transform: translateX(110vw); }
    to   { transform: translateX(-30vw); }
  }

  /* sparkles */
  .sparkle {
    position: fixed; pointer-events: none; z-index: 5;
    font-size: 18px; animation: fade 1s ease-out forwards;
  }
  @keyframes fade {
    from { opacity: 1; transform: translate(0,0) scale(1) rotate(0); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3) rotate(180deg); }
  }

  @media (max-width: 820px) {
    .stage { flex-direction: column; gap: 8px; }
    .unicorn-side { width: 150px; }
    .unicorn-side.left { display: none; }
    .moon { width: 60px; height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
  }
</style>
</head>
<body>

<!-- shared defs + unicorn symbol -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rainbowV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset=".2" stop-color="#ffa45f"/>
      <stop offset=".4" stop-color="#ffe45f"/>
      <stop offset=".6" stop-color="#6fe8a0"/>
      <stop offset=".8" stop-color="#5fb8ff"/>
      <stop offset="1" stop-color="#b47bff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffcf3f"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1dcff"/>
    </radialGradient>
  </defs>
  <symbol id="unicorn" viewBox="0 0 210 175">
    <!-- tail -->
    <path d="M52 88 C22 78 8 108 20 130 C28 146 16 160 6 166 C36 170 58 146 52 120 C50 108 54 98 58 94Z" fill="url(#rainbowV)"/>
    <!-- back legs -->
    <rect x="62" y="108" width="13" height="50" rx="6.5" fill="#e8d4fb"/>
    <rect x="122" y="108" width="13" height="50" rx="6.5" fill="#e8d4fb"/>
    <rect x="62" y="150" width="13" height="9" rx="3" fill="#d58ad6"/>
    <rect x="122" y="150" width="13" height="9" rx="3" fill="#d58ad6"/>
    <!-- body -->
    <ellipse cx="100" cy="100" rx="54" ry="33" fill="url(#bodyGrad)"/>
    <!-- front legs -->
    <rect x="80" y="112" width="13" height="52" rx="6.5" fill="#fff"/>
    <rect x="138" y="108" width="13" height="56" rx="6.5" fill="#fff"/>
    <rect x="80" y="156" width="13" height="9" rx="3" fill="#ff8ad8"/>
    <rect x="138" y="156" width="13" height="9" rx="3" fill="#ff8ad8"/>
    <!-- neck -->
    <path d="M126 92 C134 66 144 50 158 42 L177 58 C167 72 160 92 152 108Z" fill="#fff"/>
    <!-- head -->
    <path d="M150 36 C166 24 188 30 199 52 C204 62 201 71 192 72 C181 74 170 67 162 63 C151 58 144 46 150 36Z" fill="#fff"/>
    <!-- muzzle -->
    <ellipse cx="193" cy="62" rx="9" ry="8" fill="#ffe0f2"/>
    <circle cx="196" cy="60" r="1.8" fill="#c06aa8"/>
    <!-- ear -->
    <path d="M156 36 L151 18 L165 31Z" fill="#fff"/>
    <path d="M157 33 L154 23 L161 30Z" fill="#ffc2e6"/>
    <!-- horn -->
    <path d="M163 33 L183 0 L173 38Z" fill="url(#gold)"/>
    <path d="M166 30 L176 26 M168 22 L179 17 M171 13 L181 9" stroke="#e8a530" stroke-width="1.6" stroke-linecap="round"/>
    <!-- mane -->
    <path d="M154 30 C134 34 128 50 126 62 C119 76 114 88 118 100 C127 88 134 78 140 68 C146 56 152 46 162 40Z" fill="url(#rainbowV)"/>
    <path d="M150 34 C142 30 136 34 134 40 C140 38 146 38 152 40Z" fill="#ff8ad8"/>
    <!-- eye -->
    <path d="M171 46 Q177 51 183 46" stroke="#4a2a5e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M172 47 L169 50 M177 49 L177 53 M182 47 L185 50" stroke="#4a2a5e" stroke-width="1.6" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="180" cy="58" rx="6" ry="3.5" fill="#ff9ccc" opacity=".7"/>
    <!-- sparkles on body -->
    <path d="M95 92 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3Z" fill="#ffd6f2"/>
    <circle cx="112" cy="110" r="2.5" fill="#d8b6ff"/>
  </symbol>
</svg>

<div id="stars"></div>
<div class="moon"></div>

<!-- rainbow arc -->
<svg class="rainbow" viewBox="0 0 1000 520" aria-hidden="true">
  <g fill="none" stroke-width="34" stroke-linecap="round">
    <path d="M60 520 A440 440 0 0 1 940 520" stroke="#ff5fa2"/>
    <path d="M94 520 A406 406 0 0 1 906 520" stroke="#ffa45f"/>
    <path d="M128 520 A372 372 0 0 1 872 520" stroke="#ffe45f"/>
    <path d="M162 520 A338 338 0 0 1 838 520" stroke="#6fe8a0"/>
    <path d="M196 520 A304 304 0 0 1 804 520" stroke="#5fb8ff"/>
    <path d="M230 520 A270 270 0 0 1 770 520" stroke="#b47bff"/>
  </g>
</svg>

<!-- clouds -->
<svg class="cloud" style="top:18vh; width:220px; animation-duration:70s; animation-delay:-20s" viewBox="0 0 200 90" aria-hidden="true">
  <g fill="#fff"><circle cx="60" cy="55" r="30"/><circle cx="100" cy="40" r="38"/><circle cx="145" cy="55" r="28"/><rect x="40" y="55" width="125" height="30" rx="15"/></g>
</svg>
<svg class="cloud" style="top:62vh; width:160px; animation-duration:55s; animation-delay:-40s; opacity:.7" viewBox="0 0 200 90" aria-hidden="true">
  <g fill="#ffe8f7"><circle cx="60" cy="55" r="30"/><circle cx="100" cy="40" r="38"/><circle cx="145" cy="55" r="28"/><rect x="40" y="55" width="125" height="30" rx="15"/></g>
</svg>

<!-- flying unicorns (face left while flying right-to-left) -->
<div class="flyer" style="top:8vh; width:120px; animation-duration:22s; animation-delay:-5s">
  <svg viewBox="0 0 210 175" style="transform:scaleX(-1)"><use href="#unicorn"/></svg>
</div>
<div class="flyer" style="top:74vh; width:80px; animation-duration:30s; animation-delay:-18s">
  <svg viewBox="0 0 210 175" style="transform:scaleX(-1)"><use href="#unicorn"/></svg>
</div>

<main class="stage">
  <svg class="unicorn-side right" viewBox="0 0 210 175" role="img" aria-label="חד קרן"><use href="#unicorn"/></svg>

  <section class="clock-card">
    <div class="title">✨ השעה עכשיו ✨</div>
    <div class="time" id="time" aria-live="polite">00:00<span class="sec">00</span></div>
    <div class="date" id="date"></div>
  </section>

  <svg class="unicorn-side left" viewBox="0 0 210 175" role="img" aria-label="חד קרן"><use href="#unicorn"/></svg>
</main>

<script>
  // clock
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    timeEl.innerHTML =
      `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`;
    dateEl.textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - new Date().getMilliseconds());

  // stars
  const stars = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 70 + 'vh';
    s.style.setProperty('--d', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--delay', (-Math.random() * 5) + 's');
    const size = 1 + Math.random() * 3;
    s.style.width = s.style.height = size + 'px';
    stars.appendChild(s);
  }

  // sparkle trail
  const glyphs = ['✨', '⭐', '💖', '🌟', '🦄'];
  let last = 0;
  function sparkle(x, y) {
    const now = performance.now();
    if (now - last < 40) return;
    last = now;
    const el = document.createElement('span');
    el.className = 'sparkle';
    el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    el.style.setProperty('--dy', (Math.random() * 60 + 20) + 'px');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
  addEventListener('pointermove', e => sparkle(e.clientX, e.clientY));
</script>
</body>
</html>
