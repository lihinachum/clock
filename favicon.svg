      <stop offset="0" stop-color="#3a1f7a"/>
      <stop offset="1" stop-color="#e46fb4"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
